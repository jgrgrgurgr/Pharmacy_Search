{% extends "base.html" %}

{% block title %}Dashboard - Pharmacy Monitoring System{% endblock %}

{% block content %}
<div class="dashboard">
    <div class="dashboard-header">
        <h1>Quality Monitoring Dashboard</h1>
        <div class="dashboard-filters">
            <select id="timeFilter">
                <option value="7">Last 7 days</option>
                <option value="30">Last 30 days</option>
                <option value="90">Last 90 days</option>
            </select>
            <select id="regionFilter">
                <option value="">All Regions</option>
                <option value="north">North</option>
                <option value="south">South</option>
                <option value="east">East</option>
                <option value="west">West</option>
            </select>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="dashboard-card">
            <h3>Quality Score Overview</h3>
            <canvas id="qualityChart"></canvas>
        </div>
        
        <div class="dashboard-card">
            <h3>Recent Feedback</h3>
            <div id="recentFeedback" class="feedback-list">
                <!-- Feedback items will be loaded here -->
            </div>
        </div>
        
        <div class="dashboard-card">
            <h3>Low Stock Alerts</h3>
            <div id="lowStockAlerts" class="alert-list">
                <!-- Low stock alerts will be loaded here -->
            </div>
        </div>
        
        <div class="dashboard-card">
            <h3>Top Performing Pharmacies</h3>
            <div id="topPharmacies" class="pharmacy-list">
                <!-- Top pharmacies will be loaded here -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/js/dashboard.js"></script>
{% endblock %}
