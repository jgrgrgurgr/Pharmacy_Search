version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pharmacy_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pharmacy_db
      MYSQL_USER: pharmacy_user
      MYSQL_PASSWORD: pharmacy_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pharmacy_network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pharmacy_backend
    environment:
      DATABASE_URL: mysql+pymysql://pharmacy_user:pharmacy_pass@mysql:3306/pharmacy_db
      SECRET_KEY: your-production-secret-key-change-this
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./templates:/app/templates
    networks:
      - pharmacy_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pharmacy_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./static:/usr/share/nginx/html/static
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - pharmacy_network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  pharmacy_network:
    driver: bridge